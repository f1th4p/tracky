name: Build Tracky iOS App

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build Archive
        run: |
          xcodebuild \
            -project Tracky/Tracky.xcodeproj \
            -scheme Tracky \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/Tracky.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .app from archive
        run: |
          mkdir -p artifacts
          cp -R build/Tracky.xcarchive/Products/Applications/Tracky.app artifacts/

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tracky-app
          path: artifacts/Tracky.app
